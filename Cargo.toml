[package]
name = "voxanet"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.30"
wgpu = "30"
pollster = "1"
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.33"
rayon = "1.12"
glyphon = "0.12"
sysinfo = "0.39"
half = "2" # f16 bevel edge distances in Vertex (already a wgpu dependency)



[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] } # WGSL validation in unit tests (same naga wgpu uses)
